[project]
name = "nanochat-from-scratch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=5.1.0",
    "numpy>=2.4.6",
    "pyarrow>=26.0.1",
    "tiktoken>=0.14.0",
    "torch>=2.15.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
